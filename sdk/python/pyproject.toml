[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echorelay"
version = "0.1.0"
description = "Lightweight Python client for the EchoRelay data path."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/echorelay"]

[tool.hatch.build.targets.sdist]
include = ["src/echorelay", "README.md", "LICENSE"]
